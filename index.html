<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MainDraw | Tennis Matches and Tournaments</title>
    <meta
      name="description"
      content="MainDraw helps tennis players find matches, enter tournaments, and submit scores."
    />
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const forced = String(params.get("platform") || params.get("os") || "").toLowerCase();
        const uaData = navigator.userAgentData || null;
        const platform = String(uaData?.platform || navigator.platform || "");
        const ua = String(navigator.userAgent || "");
        const combined = `${ua} ${platform}`.toLowerCase();
        const isAndroid = forced === "android" || /android/.test(combined) || (uaData?.mobile && /linux/.test(combined));

        if (isAndroid && !/^\/webapp\/?/i.test(location.pathname)) {
          location.replace(`/webapp/${location.search}${location.hash}`);
        }
      })();
    </script>
    <style>
      :root {
        --green-950: #061e00;
        --green-800: #0e3300;
        --lime: #9ae36d;
        --ink: #10170f;
        --muted: #516049;
        --line: #dbe8d4;
        --surface: #ffffff;
        --bg: #f4f8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(180deg, var(--green-950) 0 42%, var(--bg) 42% 100%),
          var(--bg);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      a {
        color: inherit;
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .card {
        width: min(100%, 430px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 22px 54px rgba(6, 30, 0, 0.22);
        overflow: hidden;
      }

      .hero {
        padding: 26px 22px 20px;
        text-align: center;
      }

      .logo {
        width: 172px;
        height: 172px;
        border-radius: 8px;
        object-fit: cover;
      }

      h1 {
        margin: 18px 0 8px;
        color: var(--green-800);
        font-size: 31px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .lead {
        margin: 0 auto;
        max-width: 32ch;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .actions {
        display: grid;
        gap: 10px;
        padding: 0 22px 22px;
      }

      .appstore-link {
        display: inline-flex;
        min-height: 54px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #000000;
        line-height: 0;
        overflow: hidden;
      }

      .appstore-link img {
        display: block;
        height: 48px;
        width: auto;
      }

      .webapp-link {
        display: inline-flex;
        min-height: 54px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: var(--lime);
        color: var(--green-950);
        font-size: 16px;
        font-weight: 900;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
      }

      .note {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
      }

      .links {
        display: flex;
        justify-content: center;
        gap: 14px;
        border-top: 1px solid var(--line);
        padding: 14px 18px 16px;
        background: #f9fbf7;
      }

      .links a {
        color: var(--green-800);
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }

      @media (min-width: 720px) {
        .card {
          width: min(100%, 460px);
        }

        .hero {
          padding-top: 32px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-label="MainDraw download">
        <div class="hero">
          <img class="logo" src="./official_logo2.png" alt="MainDraw" />
          <h1>Find your next tennis match.</h1>
          <p class="lead">Join MainDraw to arrange matches, enter tournaments, and submit scores.</p>
        </div>

        <div class="actions" aria-label="Download options">
          <a
            class="appstore-link"
            href="https://apps.apple.com/app/id6768060881"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Download MainDraw on the App Store"
          >
            <img
              src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
              alt="Download on the App Store"
            />
          </a>
          <a class="webapp-link" href="/webapp/" aria-label="Open MainDraw web app">Open web app</a>
         
        </div>

        <nav class="links" aria-label="Support links">
          <a href="./privacy.html">Privacy</a>
          <a href="./support.html">Support</a>
        </nav>
      </section>
    </main>
  </body>
</html>
